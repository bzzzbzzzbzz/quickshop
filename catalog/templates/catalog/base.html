<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuickShop{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; text-align: center; }
        .product-card img { max-width: 100%; height: 200px; object-fit: cover; }
        a { text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <h1><a href="{% url 'product_list' %}">QuickShop</a></h1>
    {% block content %}
    {% endblock %}
</body>
</html>
