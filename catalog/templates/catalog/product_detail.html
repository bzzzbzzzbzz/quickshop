{% extends 'catalog/base.html' %}

{% block title %}{{ product.name }} - QuickShop{% endblock %}

{% block content %}
<a href="{% url 'product_list' %}">← Назад к каталогу</a>
<div style="display: flex; margin-top: 20px;">
    <div style="flex: 1;">
        <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 100%;">
    </div>
    <div style="flex: 2; padding-left: 20px;">
        <h2>{{ product.name }}</h2>
        <p><strong>Цена: {{ product.price }} руб.</strong></p>
        <p>Категория: {{ product.get_category_display }}</p>
        <p>{{ product.description }}</p>
    </div>
</div>
{% endblock %}
